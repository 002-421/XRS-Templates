name: XRS 0.4.89 isolated publication acceptance
on:
  push:
    branches: [codex/xrs-089-isolated-validation]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact XRS candidate SHA with successful complete Windows validation'
        required: true
        type: string
      publish_catalog:
        description: 'Execute the owner-authorized synthetic test and official immutable catalog 1.0.0 publication'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: xrs-catalog-089-isolated
  cancel-in-progress: false
jobs:
  real-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_catalog == true
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require successful Windows validation for the exact candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          node -e "(async()=>{const sha=process.env.CANDIDATE_SHA;if(!/^[a-f0-9]{40}$/.test(sha))throw Error('CANDIDATE_SHA');const r=await fetch('https://api.github.com/repos/002-421/-main/actions/workflows/xrs-089-validation.yml/runs?per_page=100');if(!r.ok)throw Error('VALIDATION_LOOKUP');const data=await r.json();if(!data.workflow_runs.some(x=>x.head_sha===sha&&x.conclusion==='success'))throw Error('WINDOWS_VALIDATION_REQUIRED');})().catch(e=>{console.error(e.message);process.exitCode=1;})"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: 002-421/-main
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: reviewed-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            reviewed-app/x-ray-report-studio/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - run: npm ci
        working-directory: reviewed-app/x-ray-report-studio
      - run: npm run desktop:install
        working-directory: reviewed-app/x-ray-report-studio
      - name: Real OAuth and isolated prerelease; production 1.0.0 stays unchanged
        shell: pwsh
        env:
          XRS_REAL_CATALOG_ACCEPTANCE: '1'
          XRS_PROBE_APP_ROOT: ${{ github.workspace }}/reviewed-app/x-ray-report-studio
          XRS_OFFICIAL_SOURCE: ${{ github.workspace }}/test-output/official-source
          XRS_ACCEPTANCE_PRIVATE: ${{ runner.temp }}/xrs-catalog-089-private
        run: |
          node scripts/run-catalog-089-acceptance.cjs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Real-GitHub-catalog-public-diagnostics
          path: |
            test-output/catalog-089/result.json
            test-output/catalog-089/result.json
          if-no-files-found: ignore
      - name: Remove isolated credentials and profiles
        if: always()
        shell: pwsh
        run: |
          $privatePath = Join-Path $env:RUNNER_TEMP 'xrs-catalog-089-private'
          if (Test-Path $privatePath) { Remove-Item -LiteralPath $privatePath -Recurse -Force }
